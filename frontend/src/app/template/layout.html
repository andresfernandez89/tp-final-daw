<header class="header">
  <div class="header-inner">
    <span class="brand">Clínica médica</span>
    <div class="session">
      @if (usuario) {
        <span
          ><strong>{{ usuario.email }}</strong> · {{ usuario.role }}</span
        >
      }
      <button type="button" class="logout" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
</header>

<nav class="nav" aria-label="Navegación principal">
  <div class="nav-inner">
    <a routerLink="/turnos" routerLinkActive="selected" ariaCurrentWhenActive="page">
      {{ usuario?.role === 'MEDICO' ? 'Mis turnos' : 'Reservas' }}
    </a>
    @if (usuario?.role === 'PACIENTE' || usuario?.role === 'ADMINISTRADOR') {
      <a routerLink="/reservar-turno" routerLinkActive="selected" ariaCurrentWhenActive="page"
        >Reservar turno</a
      >
    }
    @if (usuario?.role === 'ADMINISTRADOR') {
      <a routerLink="/medicos" routerLinkActive="selected" ariaCurrentWhenActive="page">Médicos</a>
    }
  </div>
</nav>

<main class="main">
  <router-outlet />
</main>
